name: Contribution snake

on:
  push:
    branches: [main]
    paths: ['.github/workflows/profile-snake.yml']
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: profile-contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Animate the contribution graph
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: PerfectPoH
          outputs: |
            dist/contribution-snake.svg?palette=github-light&color_snake=%236644c8
            dist/contribution-snake-dark.svg?palette=github-dark&color_snake=%236fffe2
      - name: Pass the generated images to the publishing job
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: contribution-snake
          path: dist/*.svg
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out the profile repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
      - name: Download graph images
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: contribution-snake
          path: ${{ runner.temp }}/contribution-snake
      - name: Publish the images
        shell: bash
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/profile-snake; then
            git switch -c profile-snake origin/profile-snake
          else
            git switch --orphan profile-snake
          fi
          cp "$RUNNER_TEMP/contribution-snake/contribution-snake.svg" .
          cp "$RUNNER_TEMP/contribution-snake/contribution-snake-dark.svg" .
          git add -- contribution-snake.svg contribution-snake-dark.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update contribution snake'
          git push origin HEAD:refs/heads/profile-snake
